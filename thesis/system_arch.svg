<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <!-- Blue arrowhead (request path) -->
    <marker id="ah-blue" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
    <!-- Orange arrowhead (checkpoint path) -->
    <marker id="ah-orange" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#ea580c" stroke-width="1.5"/>
    </marker>
    <!-- Purple arrowhead (scheduler) -->
    <marker id="ah-purple" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="820" height="460" fill="white"/>

  <!-- ── HEAD NODE region ── -->
  <rect x="30" y="68" width="560" height="156" rx="10"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="46" y="86" fill="#1d4ed8" font-size="11" font-weight="600" font-family="sans-serif">Head Node</text>

  <!-- ── WORKER NODES region ── -->
  <rect x="30" y="275" width="500" height="72" rx="10"
        fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="46" y="291" fill="#c2410c" font-size="11" font-weight="600" font-family="sans-serif">Worker Nodes (vLLM + sllm-store)</text>

  <!-- ── STORAGE region ── -->
  <rect x="560" y="275" width="230" height="72" rx="10"
        fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="576" y="291" fill="#15803d" font-size="11" font-weight="600" font-family="sans-serif">Storage</text>

  <!-- ═══════════ NODES ═══════════ -->

  <!-- User / Client -->
  <rect x="295" y="8" width="190" height="44" rx="7"
        fill="white" stroke="#64748b" stroke-width="2"/>
  <text x="390" y="28" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">User / Client</text>
  <text x="390" y="44" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">batch submit</text>

  <!-- API Gateway -->
  <rect x="270" y="82" width="200" height="44" rx="7"
        fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="102" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">API Gateway</text>
  <text x="370" y="118" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">POST /v1/batches</text>

  <!-- BatchScheduler -->
  <rect x="44" y="148" width="190" height="44" rx="7"
        fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="139" y="168" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">BatchScheduler</text>
  <text x="139" y="184" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">group · order · prefetch</text>

  <!-- StorageManager -->
  <rect x="260" y="148" width="190" height="44" rx="7"
        fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="355" y="168" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">StorageManager</text>
  <text x="355" y="184" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">prefetch trigger</text>

  <!-- Router -->
  <rect x="476" y="148" width="100" height="44" rx="7"
        fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="526" y="172" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Router</text>

  <!-- Worker 1 -->
  <rect x="44" y="300" width="130" height="34" rx="6"
        fill="white" stroke="#ea580c" stroke-width="1.8"/>
  <text x="109" y="322" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="600">Worker 1</text>

  <!-- Worker 2 -->
  <rect x="194" y="300" width="130" height="34" rx="6"
        fill="white" stroke="#ea580c" stroke-width="1.8"/>
  <text x="259" y="322" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="600">Worker 2</text>

  <!-- Worker N -->
  <rect x="344" y="300" width="130" height="34" rx="6"
        fill="white" stroke="#ea580c" stroke-width="1.8"/>
  <text x="409" y="322" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="600">Worker N</text>

  <!-- NVMe SSD -->
  <rect x="576" y="300" width="86" height="34" rx="6"
        fill="white" stroke="#15803d" stroke-width="1.8"/>
  <text x="619" y="322" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">NVMe SSD</text>

  <!-- NFS / S3 -->
  <rect x="682" y="300" width="86" height="34" rx="6"
        fill="white" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="725" y="322" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">NFS / S3</text>

  <!-- ═══════════ ARROWS ═══════════ -->

  <!-- User → API Gateway -->
  <line x1="390" y1="52" x2="370" y2="82"
        stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah-blue)"/>

  <!-- API Gateway → BatchScheduler -->
  <line x1="310" y1="126" x2="200" y2="148"
        stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)"/>
  <text x="228" y="140" fill="#7c3aed" font-size="9" font-family="sans-serif">tasks</text>

  <!-- API Gateway → Router -->
  <line x1="432" y1="126" x2="506" y2="148"
        stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah-blue)"/>

  <!-- BatchScheduler → StorageManager (prefetch trigger) -->
  <line x1="234" y1="170" x2="260" y2="170"
        stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-orange)"/>
  <text x="237" y="163" fill="#ea580c" font-size="9" font-family="sans-serif">prefetch</text>

  <!-- BatchScheduler → Router (grouped & ordered) -->
  <path d="M 234 155 Q 370 120 476 160" fill="none"
        stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)"/>
  <text x="330" y="126" fill="#7c3aed" font-size="9" font-family="sans-serif" text-anchor="middle">grouped &amp; ordered tasks</text>

  <!-- Router → Worker 1 -->
  <line x1="498" y1="192" x2="180" y2="300"
        stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>

  <!-- Router → Worker 2 -->
  <line x1="514" y1="192" x2="290" y2="300"
        stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>

  <!-- Router → Worker N -->
  <line x1="530" y1="192" x2="430" y2="300"
        stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>

  <!-- StorageManager → Worker 2 (prefetch_to_cpu, dashed) -->
  <path d="M 355 192 L 355 250 L 259 250 L 259 300" fill="none"
        stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#ah-orange)"/>
  <text x="270" y="244" fill="#ea580c" font-size="9" font-family="sans-serif">prefetch_to_cpu</text>

  <!-- NVMe SSD → Workers -->
  <line x1="605" y1="300" x2="470" y2="334"
        stroke="#15803d" stroke-width="1.5" marker-end="url(#ah-orange)"/>
  <line x1="609" y1="300" x2="320" y2="334"
        stroke="#15803d" stroke-width="1.5" marker-end="url(#ah-orange)"/>

  <!-- NFS/S3 → Worker N (dashed) -->
  <line x1="725" y1="300" x2="475" y2="334"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-orange)"/>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="606" y="384" width="188" height="68" rx="6"
        fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="618" y="400" fill="#475569" font-size="10" font-weight="700" font-family="sans-serif">Legend</text>
  <!-- blue -->
  <line x1="618" y1="415" x2="638" y2="415" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="644" y="419" fill="#475569" font-size="10" font-family="sans-serif">request path</text>
  <!-- orange dashed -->
  <line x1="618" y1="432" x2="638" y2="432" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#ah-orange)"/>
  <text x="644" y="436" fill="#475569" font-size="10" font-family="sans-serif">checkpoint path</text>
  <!-- purple -->
  <line x1="618" y1="449" x2="638" y2="449" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="644" y="453" fill="#475569" font-size="10" font-family="sans-serif">scheduler control</text>
</svg>
